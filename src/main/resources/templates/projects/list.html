<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Projects | TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/main.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar('projects')}"></div>

<div class="main">
    <div class="topbar">
        <div class="search-bar">
            <i class="bi bi-search"></i>
            <input type="text" placeholder="Search projects..."/>
        </div>
        <div class="topbar-right">
            <div class="avatar" th:text="${#strings.toUpperCase(#strings.substring(user.username,0,1))}">D</div>
        </div>
    </div>

    <div class="content">
        <div class="page-header">
            <div>
                <div class="page-title">Projects</div>
                <div class="page-subtitle">Manage all your projects</div>
            </div>
            <a href="/projects/new" class="btn-primary-custom">
                <i class="bi bi-plus-lg"></i> New Project
            </a>
        </div>

        <div class="row g-3">
            <div th:each="project : ${projects}" class="col-md-6 col-xl-4">
                <div class="project-card h-100">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <a th:href="@{/projects/{id}(id=${project.id})}"
                           class="project-name" th:text="${project.name}">Project</a>
                        <span class="badge-status"
                              th:classappend="${project.status.name() == 'ACTIVE'} ? 'badge-active' :
                                              (${project.status.name() == 'COMPLETED'} ? 'badge-completed' :
                                              (${project.status.name() == 'ON_HOLD'} ? 'badge-onhold' : 'badge-archived'))"
                              th:text="${project.status}"></span>
                    </div>
                    <div class="project-desc" th:text="${project.description != null and !project.description.isEmpty()} ? ${project.description} : 'No description'"></div>
                    <div th:if="${project.deadline != null}" class="task-meta mt-2">
                        <i class="bi bi-calendar-event me-1"></i>
                        <span th:text="${project.deadline}"></span>
                    </div>
                    <div class="progress-bar-wrap">
                        <div class="progress-label">
                            <span>Progress</span>
                            <span th:text="${projectProgressMap != null and projectProgressMap[project.id] != null} ? ${projectProgressMap[project.id]} + '%' : '0%'">0%</span>
                        </div>
                        <div class="progress">
                            <div class="progress-fill"
                                 th:style="'width:' + (${projectProgressMap != null and projectProgressMap[project.id] != null} ? ${projectProgressMap[project.id]} : 0) + '%'"></div>
                        </div>
                    </div>
                    <div class="mt-3">
                        <a th:href="@{/projects/{id}(id=${project.id})}"
                           class="btn-secondary-custom" style="font-size:0.8rem; padding:7px 14px;">
                            <i class="bi bi-arrow-right"></i> Open
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(projects)}" class="empty-state">
            <i class="bi bi-folder-x"></i>
            <p>No projects yet. Create your first one!</p>
            <a href="/projects/new" class="btn-primary-custom mt-3">
                <i class="bi bi-plus-lg"></i> New Project
            </a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
