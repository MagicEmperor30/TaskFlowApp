<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Project | TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/main.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar('projects')}"></div>

<div class="main">
    <div class="topbar">
        <div class="d-flex align-items-center gap-2" style="color:var(--text-secondary); font-size:0.9rem;">
            <a href="/projects" style="color:var(--text-secondary); text-decoration:none;">Projects</a>
            <i class="bi bi-chevron-right"></i>
            <span style="color:var(--text-main); font-weight:600;">New Project</span>
        </div>
        <div class="topbar-right">
            <div class="avatar" th:text="${user?.username != null and !#strings.isEmpty(user.username) ? #strings.toUpperCase(#strings.substring(user.username, 0, 1)) : '?'}"></div>
        </div>
    </div>

    <div class="content">
        <div style="max-width:600px;">
            <div class="page-header">
                <div>
                    <div class="page-title">Create New Project</div>
                    <div class="page-subtitle">Set up a new project and start adding tasks</div>
                </div>
            </div>

            <div class="card-custom">
                <form method="post" action="/projects/new">
                    <div class="mb-4">
                        <label class="form-label">Project Name *</label>
                        <input type="text" name="name" class="form-control"
                               placeholder="e.g. Website Redesign" required/>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="4"
                                  placeholder="What is this project about?"></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Deadline</label>
                        <input type="date" name="deadline" class="form-control"/>
                    </div>
                    <div class="d-flex gap-3 mt-4">
                        <button type="submit" class="btn-primary-custom">
                            <i class="bi bi-check-lg"></i> Create Project
                        </button>
                        <a href="/projects" class="btn-secondary-custom">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
