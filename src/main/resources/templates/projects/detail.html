<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Project | TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/main.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar('projects')}"></div>

<div class="main">
    <div class="topbar">
        <div class="d-flex align-items-center gap-2" style="color:var(--text-secondary); font-size:0.9rem;">
            <a href="/projects" style="color:var(--text-secondary); text-decoration:none;">Projects</a>
            <i class="bi bi-chevron-right"></i>
            <span style="color:var(--text-main); font-weight:600;" th:text="${project.name}">Project</span>
        </div>
        <div class="topbar-right">
            <div class="avatar" th:text="${#strings.toUpperCase(#strings.substring(user.username,0,1))}">D</div>
        </div>
    </div>

    <div class="content">
        <div class="d-flex gap-4">

            <!-- Main area -->
            <div style="flex:1; min-width:0;">

                <!-- Project header -->
                <div class="card-custom mb-4">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h5 style="font-weight:700; margin-bottom:6px;" th:text="${project.name}">Project Name</h5>
                            <p class="project-desc" th:text="${project.description != null and !project.description.isEmpty()} ? ${project.description} : 'No description'"></p>
                            <div class="d-flex gap-3 mt-3 flex-wrap">
                                <span class="badge-status"
                                      th:classappend="${project.status.name() == 'ACTIVE'} ? 'badge-active' :
                                                      (${project.status.name() == 'COMPLETED'} ? 'badge-completed' :
                                                      (${project.status.name() == 'ON_HOLD'} ? 'badge-onhold' : 'badge-archived'))"
                                      th:text="${project.status}"></span>
                                <span class="task-meta" th:if="${project.deadline != null}">
                                    <i class="bi bi-calendar-event me-1"></i>
                                    <span th:text="${project.deadline}"></span>
                                </span>
                                <span class="task-meta">
                                    <i class="bi bi-people me-1"></i>
                                    <span th:text="${members.size()} + ' members'"></span>
                                </span>
                                <span class="task-meta">
                                    <i class="bi bi-list-task me-1"></i>
                                    <span th:text="${project.tasks.size()} + ' tasks'"></span>
                                </span>
                            </div>
                        </div>
                        <div th:if="${isAdmin}" class="d-flex gap-2">
                            <a th:href="@{/tasks/new(projectId=${project.id})}" class="btn-primary-custom" style="font-size:0.85rem; padding:8px 16px;">
                                <i class="bi bi-plus-lg"></i> Add Task
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Tasks -->
                <div class="section-title">
                    <span>Tasks</span>
                </div>

                <!-- Filter tabs -->
                <div class="mb-3 d-flex gap-2 flex-wrap">
                    <button class="badge-status badge-active" style="border:none; cursor:pointer; padding:6px 14px;">All</button>
                    <button class="badge-status badge-todo" style="border:none; cursor:pointer; padding:6px 14px;">Todo</button>
                    <button class="badge-status badge-inprogress" style="border:none; cursor:pointer; padding:6px 14px;">In Progress</button>
                    <button class="badge-status badge-done" style="border:none; cursor:pointer; padding:6px 14px;">Done</button>
                </div>

                <div th:each="task : ${project.tasks}" class="task-item"
                     th:classappend="${task.status.name() == 'DONE'} ? ' done' :
                                     (${task.priority.name() == 'URGENT'} ? ' urgent' :
                                     (${task.status.name() == 'IN_PROGRESS'} ? ' in-progress' : ''))">
                    <div class="d-flex justify-content-between align-items-start">
                        <div style="flex:1; min-width:0;">
                            <a th:href="@{/tasks/{id}(id=${task.id})}"
                               class="task-name" th:text="${task.title}">Task</a>
                            <div class="d-flex gap-2 mt-2 flex-wrap">
                                <span class="badge-status"
                                      th:classappend="${task.priority.name() == 'LOW'} ? 'badge-low' :
                                                      (${task.priority.name() == 'MEDIUM'} ? 'badge-medium' :
                                                      (${task.priority.name() == 'HIGH'} ? 'badge-high' : 'badge-urgent'))"
                                      th:text="${task.priority}"></span>
                                <span class="badge-status"
                                      th:classappend="${task.status.name() == 'DONE'} ? 'badge-done' :
                                                      (${task.status.name() == 'IN_PROGRESS'} ? 'badge-inprogress' :
                                                      (${task.status.name() == 'IN_REVIEW'} ? 'badge-inreview' : 'badge-todo'))"
                                      th:text="${task.status}"></span>
                                <span class="task-meta" th:if="${task.assignedUser != null}">
                                    <i class="bi bi-person me-1"></i>
                                    <span th:text="${task.assignedUser.username}"></span>
                                </span>
                                <span class="task-meta" th:if="${task.deadline != null}"
                                      th:classappend="${task.deadline.isBefore(T(java.time.LocalDate).now())} ? 'overdue' :
                                                      (${task.deadline.isBefore(T(java.time.LocalDate).now().plusDays(3))} ? 'due-soon' : '')">
                                    <i class="bi bi-clock me-1"></i>
                                    <span th:text="${task.deadline}"></span>
                                </span>
                            </div>
                        </div>
                        <a th:href="@{/tasks/{id}(id=${task.id})}" class="icon-btn ms-2">
                            <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(project.tasks)}" class="empty-state">
                    <i class="bi bi-list-task"></i>
                    <p>No tasks yet</p>
                    <a th:if="${isAdmin}" th:href="@{/tasks/new(projectId=${project.id})}"
                       class="btn-primary-custom mt-3" style="display:inline-flex;">
                        <i class="bi bi-plus-lg"></i> Add First Task
                    </a>
                </div>
            </div>

            <!-- Right panel -->
            <div style="width:280px; flex-shrink:0;">

                <!-- Members -->
                <div class="card-custom mb-4">
                    <div class="section-title" style="margin-bottom:12px;">
                        <span>Members</span>
                    </div>
                    <div th:each="member : ${members}" class="member-item">
                        <div class="avatar" th:text="${#strings.toUpperCase(#strings.substring(member.user.username,0,1))}">A</div>
                        <div style="flex:1;">
                            <div style="font-weight:600; font-size:0.85rem;" th:text="${member.user.username}"></div>
                            <div class="task-meta" th:text="${member.user.email}"></div>
                        </div>
                        <span class="badge-status"
                              th:classappend="${member.role.name() == 'ADMIN'} ? 'badge-completed' : 'badge-todo'"
                              th:text="${member.role}"></span>
                    </div>
                </div>

                <!-- Add Member (Admin only) -->
                <div th:if="${isAdmin}" class="card-custom mb-4">
                    <div class="section-title" style="margin-bottom:12px;">
                        <span>Add Member</span>
                    </div>
                    <form th:action="@{/projects/{id}/add-member(id=${project.id})}" method="post">
                        <div class="d-flex gap-2">
                            <input type="text" name="keyword" class="form-control"
                                   placeholder="Search username or email..." style="font-size:0.85rem;"/>
                            <button type="submit" class="btn-primary-custom" style="padding:8px 12px; white-space:nowrap;">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </form>

                    <div th:if="${searchResults != null and !#lists.isEmpty(searchResults)}" class="mt-3">
                        <div th:each="result : ${searchResults}" class="member-item">
                            <div class="avatar" th:text="${#strings.toUpperCase(#strings.substring(result.username,0,1))}">A</div>
                            <div style="flex:1;">
                                <div style="font-weight:600; font-size:0.85rem;" th:text="${result.username}"></div>
                                <div class="task-meta" th:text="${result.email}"></div>
                            </div>
                            <form th:action="@{/projects/{id}/add-member/{userId}(id=${project.id},userId=${result.id})}" method="post">
                                <button type="submit" class="btn-primary-custom" style="padding:5px 10px; font-size:0.75rem;">
                                    Add
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Danger zone -->
                <div th:if="${isAdmin}" class="card-custom" style="border-color:#FECACA;">
                    <div style="font-weight:600; font-size:0.85rem; color:var(--danger); margin-bottom:12px;">
                        <i class="bi bi-exclamation-triangle me-2"></i>Danger Zone
                    </div>
                    <form th:action="@{/projects/{id}/delete(id=${project.id})}" method="post">
                        <button type="submit" class="btn-danger-custom w-100"
                                style="justify-content:center;"
                                onclick="return confirm('Delete this project and all its tasks?')">
                            <i class="bi bi-trash"></i> Delete Project
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
