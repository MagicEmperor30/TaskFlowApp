<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Task | TaskFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/main.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar('projects')}"></div>

<div class="main">
    <div class="topbar">
        <div class="d-flex align-items-center gap-2" style="color:var(--text-secondary); font-size:0.9rem;">
            <a href="/projects" style="color:var(--text-secondary); text-decoration:none;">Projects</a>
            <i class="bi bi-chevron-right"></i>
            <a th:href="@{/projects/{id}(id=${project.id})}"
               style="color:var(--text-secondary); text-decoration:none;" th:text="${project.name}">Project</a>
            <i class="bi bi-chevron-right"></i>
            <span style="color:var(--text-main); font-weight:600;">New Task</span>
        </div>
        <div class="topbar-right">
                <div class="avatar" th:text="${user?.username != null and !#strings.isEmpty(user.username) ? #strings.toUpperCase(#strings.substring(user.username, 0, 1)) : '?'}"></div>
        </div>
    </div>

    <div class="content">
        <div style="max-width:600px;">
            <div class="page-header">
                <div>
                    <div class="page-title">Create New Task</div>
                    <div class="page-subtitle" th:text="'For project: ' + ${project.name}"></div>
                </div>
            </div>

            <div class="card-custom">
                <form method="post" action="/tasks/new">
                    <input type="hidden" name="projectId" th:value="${project.id}"/>

                    <div class="mb-4">
                        <label class="form-label">Task Title *</label>
                        <input type="text" name="title" class="form-control"
                               placeholder="e.g. Design the homepage" required/>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3"
                                  placeholder="What needs to be done?"></textarea>
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label">Priority</label>
                            <select name="priority" class="form-select">
                                <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Deadline</label>
                            <input type="date" name="deadline" class="form-control"/>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Assign To</label>
                        <select name="assignedUserId" class="form-select">
                            <option value="">-- Unassigned --</option>
                            <option th:each="member : ${members}"
                                    th:value="${member.user.id}"
                                    th:text="${member.user.username + ' (' + member.user.email + ')'}"></option>
                        </select>
                    </div>

                    <div class="d-flex gap-3 mt-4">
                        <button type="submit" class="btn-primary-custom">
                            <i class="bi bi-check-lg"></i> Create Task
                        </button>
                        <a th:href="@{/projects/{id}(id=${project.id})}" class="btn-secondary-custom">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
