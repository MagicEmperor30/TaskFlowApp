<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TaskFlow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #2563EB;
            --primary-dark: #1D4ED8;
            --primary-light: #3B82F6;
            --secondary: #8B5CF6;
            --text-dark: #0F172A;
            --text-gray: #64748B;
            --text-light: #94A3B8;
            --bg-light: #F8FAFC;
            --bg-lighter: #F1F5F9;
            --border-color: #E2E8F0;
            --success: #10B981;
            --danger: #EF4444;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
            background: linear-gradient(135deg, #F0F4FF 0%, #F8FAFC 50%, #EFF6FF 100%);
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(37, 99, 235, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            animation: moveGradient 15s ease-in-out infinite;
            z-index: -1;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 100% 0%, rgba(139, 92, 246, 0.05) 0%, transparent 40%),
                        radial-gradient(circle at 0% 100%, rgba(37, 99, 235, 0.05) 0%, transparent 40%);
            z-index: -1;
            pointer-events: none;
        }

        @keyframes moveGradient {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-logo {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .navbar-logo:hover { transform: scale(1.05); }
        .navbar-logo i { font-size: 26px; }

        .nav-link {
            color: var(--text-dark);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .nav-link:hover { color: var(--primary); }

        .auth-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            justify-items: center;
            min-height: calc(100vh - 80px);
            padding: 60px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .auth-animation {
            width: 100%;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: slideInLeft 0.8s ease-out;
        }

        .animation-container { width: 100%; height: 100%; }

        .auth-form-wrapper {
            width: 100%;
            max-width: 450px;
            animation: slideInRight 0.8s ease-out;
        }

        .auth-card {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            border: 2px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
        }

        .auth-card h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 12px;
        }

        .auth-card .subtitle {
            font-size: 14px;
            color: var(--text-gray);
            margin-bottom: 32px;
        }

        .form-group { margin-bottom: 24px; }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 10px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            transition: all 0.3s ease;
            background: var(--bg-light);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .form-group input::placeholder { color: var(--text-light); }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .forgot-password {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .forgot-password:hover { color: var(--primary-dark); }

        .btn-auth {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.35);
        }

        .btn-auth:active { transform: translateY(0); }

        .auth-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 14px;
            color: var(--text-gray);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s ease;
        }

        .auth-footer a:hover { color: var(--primary-dark); }

        .error-message {
            background: #FEE2E2;
            color: #991B1B;
            padding: 14px 16px;
            border-radius: 10px;
            border: 2px solid #FECACA;
            margin-bottom: 24px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideDown 0.3s ease;
        }

        .error-message i { font-size: 18px; }

        .success-message {
            background: #DCFCE7;
            color: #15803D;
            padding: 14px 16px;
            border-radius: 10px;
            border: 2px solid #BBF7D0;
            margin-bottom: 24px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideDown 0.3s ease;
        }

        .success-message i { font-size: 18px; }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1024px) {
            nav { padding: 16px 40px; }
            .auth-container {
                grid-template-columns: 1fr;
                gap: 40px;
                padding: 40px;
                min-height: auto;
            }
            .auth-animation { display: none; }
            .auth-form-wrapper { max-width: 100%; }
        }

        @media (max-width: 768px) {
            nav { padding: 12px 20px; }
            .navbar-logo { font-size: 20px; }
            .auth-container { padding: 20px; min-height: auto; }
            .auth-card { padding: 40px 24px; }
            .auth-card h1 { font-size: 26px; }
        }
    </style>
</head>
<body>

<nav>
    <a href="/" class="navbar-logo">
        <i class="bi bi-check2-square"></i> TaskFlow
    </a>
    <a href="/register" class="nav-link">Create Account</a>
</nav>

<div class="auth-container">
    <div class="auth-animation">
        <div class="animation-container" id="login-lottie"></div>
    </div>

    <div class="auth-form-wrapper">
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to your TaskFlow account to continue</p>

            <div th:if="${error}" class="error-message">
                <i class="bi bi-exclamation-circle"></i>
                <span th:text="${error}"></span>
            </div>

            <!-- shown after company registration -->
            <div th:if="${param.registered}" class="success-message">
                <i class="bi bi-check-circle"></i>
                <span>Company registered! Sign in to get started.</span>
            </div>

            <!-- shown after joining via invite -->
            <div th:if="${param.joined}" class="success-message">
                <i class="bi bi-check-circle"></i>
                <span>Account created! Sign in to join your team.</span>
            </div>

            <form method="post" action="/login">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                            autocomplete="email"
                    />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                    />
                </div>

                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" name="remember" />
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-auth">Sign In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register">Register your company</a>
            </div>
        </div>
    </div>
</div>

<script>
    lottie.loadAnimation({
        container: document.getElementById('login-lottie'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: 'https://assets4.lottiefiles.com/packages/lf20_ygjvrvxt.json'
    });

    document.querySelectorAll('.form-group input').forEach(input => {
        input.addEventListener('focus', function () { this.parentElement.classList.add('focused'); });
        input.addEventListener('blur', function () { this.parentElement.classList.remove('focused'); });
    });
</script>

</body>
</html>
