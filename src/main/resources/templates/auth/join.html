<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Team | TaskFlow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #2563EB;
            --primary-dark: #1D4ED8;
            --secondary: #8B5CF6;
            --text-dark: #0F172A;
            --text-gray: #64748B;
            --text-light: #94A3B8;
            --bg-light: #F8FAFC;
            --border-color: #E2E8F0;
            --success: #10B981;
            --danger: #EF4444;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
            background: linear-gradient(135deg, #F0F4FF 0%, #F8FAFC 50%, #EFF6FF 100%);
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(37, 99, 235, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            animation: moveGradient 15s ease-in-out infinite;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes moveGradient {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-logo {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .navbar-logo:hover { transform: scale(1.05); }
        .navbar-logo i { font-size: 26px; }

        .auth-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            justify-items: center;
            min-height: calc(100vh - 80px);
            padding: 60px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .auth-animation {
            width: 100%;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: slideInLeft 0.8s ease-out;
        }

        .animation-container { width: 100%; height: 100%; }

        .auth-form-wrapper {
            width: 100%;
            max-width: 450px;
            animation: slideInRight 0.8s ease-out;
        }

        .auth-card {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            border: 2px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--success) 0%, var(--primary) 100%);
        }

        .auth-card h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 12px;
        }

        .auth-card .subtitle {
            font-size: 14px;
            color: var(--text-gray);
            margin-bottom: 24px;
        }

        /* Company badge shown on the join page */
        .company-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #EFF6FF, #F5F3FF);
            border: 2px solid #BFDBFE;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 28px;
        }

        .company-badge-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            flex-shrink: 0;
        }

        .company-badge-text {
            display: flex;
            flex-direction: column;
        }

        .company-badge-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-light);
        }

        .company-badge-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 10px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            transition: all 0.3s ease;
            background: var(--bg-light);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .form-group input::placeholder { color: var(--text-light); }

        .password-requirement {
            font-size: 12px;
            color: var(--text-gray);
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .password-requirement.met { color: var(--success); }
        .password-requirement i { font-size: 14px; }

        .btn-auth {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.35);
        }

        .btn-auth:active { transform: translateY(0); }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-gray);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        .auth-footer a:hover { color: var(--primary-dark); }

        .error-message {
            background: #FEE2E2;
            color: #991B1B;
            padding: 14px 16px;
            border-radius: 10px;
            border: 2px solid #FECACA;
            margin-bottom: 24px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideDown 0.3s ease;
        }

        .error-message i { font-size: 18px; }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1024px) {
            nav { padding: 16px 40px; }
            .auth-container {
                grid-template-columns: 1fr;
                gap: 40px;
                padding: 40px;
                min-height: auto;
            }
            .auth-animation { display: none; }
            .auth-form-wrapper { max-width: 100%; }
        }

        @media (max-width: 768px) {
            nav { padding: 12px 20px; }
            .navbar-logo { font-size: 20px; }
            .auth-container { padding: 20px; min-height: auto; }
            .auth-card { padding: 40px 24px; }
            .auth-card h1 { font-size: 26px; }
        }
    </style>
</head>
<body>

<nav>
    <a href="/" class="navbar-logo">
        <i class="bi bi-check2-square"></i> TaskFlow
    </a>
</nav>

<div class="auth-container">
    <div class="auth-animation">
        <div class="animation-container" id="join-lottie"></div>
    </div>

    <div class="auth-form-wrapper">
        <div class="auth-card">
            <h1>Join Your Team</h1>
            <p class="subtitle">You've been invited to collaborate on TaskFlow</p>

            <!-- Company badge -->
            <div class="company-badge">
                <div class="company-badge-icon">
                    <i class="bi bi-building"></i>
                </div>
                <div class="company-badge-text">
                    <span class="company-badge-label">Joining</span>
                    <span class="company-badge-name" th:text="${companyName}">Company Name</span>
                </div>
            </div>

            <div th:if="${error}" class="error-message">
                <i class="bi bi-exclamation-circle"></i>
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/join/{token}(token=${token})}" method="post" id="joinForm">
                <div class="form-group">
                    <label for="username">Your Name</label>
                    <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="John Doe"
                            required
                            autocomplete="name"
                    />
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                            autocomplete="email"
                    />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a strong password"
                            required
                            autocomplete="new-password"
                    />
                    <div class="password-requirement" id="passwordLength">
                        <i class="bi bi-circle"></i>
                        <span>At least 8 characters</span>
                    </div>
                    <div class="password-requirement" id="passwordUpper">
                        <i class="bi bi-circle"></i>
                        <span>Contains uppercase letter</span>
                    </div>
                    <div class="password-requirement" id="passwordNumber">
                        <i class="bi bi-circle"></i>
                        <span>Contains a number</span>
                    </div>
                </div>

                <button type="submit" class="btn-auth">
                    <i class="bi bi-person-check"></i> Create Account &amp; Join Team
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="/login">Sign in</a>
            </div>
        </div>
    </div>
</div>

<script>
    lottie.loadAnimation({
        container: document.getElementById('join-lottie'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: 'https://assets3.lottiefiles.com/packages/lf20_jcikwtux.json'
    });

    const passwordInput = document.getElementById('password');

    function setMet(el, met) {
        const icon = el.querySelector('i');
        if (met) {
            el.classList.add('met');
            icon.className = 'bi bi-check-circle-fill';
        } else {
            el.classList.remove('met');
            icon.className = 'bi bi-circle';
        }
    }

    passwordInput.addEventListener('input', function () {
        const v = this.value;
        setMet(document.getElementById('passwordLength'), v.length >= 8);
        setMet(document.getElementById('passwordUpper'), /[A-Z]/.test(v));
        setMet(document.getElementById('passwordNumber'), /\d/.test(v));
    });
</script>

</body>
</html>
