<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar(activePage)" class="sidebar">
    <div class="sidebar-logo">
        <i class="bi bi-check2-square"></i> TaskFlow
    </div>

    <nav>
        <a href="/dashboard" class="nav-item" th:classappend="${activePage == 'dashboard'} ? ' active' : ''">
            <i class="bi bi-grid-1x2-fill"></i> Dashboard
        </a>
        <a href="/tasks/my" class="nav-item" th:classappend="${activePage == 'tasks'} ? ' active' : ''">
            <i class="bi bi-list-task"></i> My Tasks
        </a>
        <a href="/company"  class="nav-item" th:classappend="${activePage == 'members'} ? ' active' : ''">
            <i class="bi bi-building"></i> Company
        </a>
        <a href="/projects" class="nav-item" th:classappend="${activePage == 'projects'} ? ' active' : ''">
            <i class="bi bi-folder2-open"></i> Projects
        </a>
        <a href="/profile" class="nav-item" th:classappend="${activePage == 'profile'} ? ' active' : ''">
            <i class="bi bi-person"></i> Profile
        </a>
    </nav>

    <div class="sidebar-bottom">
        <a href="/projects/new" class="create-btn">
            <i class="bi bi-plus-lg"></i> Create Project
        </a>
        <a href="/logout" class="nav-item mt-3" style="color:#DC2626;">
            <i class="bi bi-box-arrow-right"></i> Logout
        </a>
    </div>
</aside>

</body>
</html>
